<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin Party - News</title>
    <link rel="icon" type="image/webp" href="assets/images/logo.webp" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/projects.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <!-- Logo a la izquierda -->
        <div class="logo">
            <a href="index.html"><img src="assets/images/logo.webp" alt="Goblin Party Logo" class="logo-img"></a>
        </div>

        <!-- Hamburger a la derecha -->
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Menú -->
        <nav id="mobileNav">
            <div class="dropdown">
                <a href="index.html#projects" class="dropbtn">Games <i class="fa-solid fa-caret-down"></i></a>
                <div class="dropdown-content">
                    <a href="index.html#projects">Bone Path</a>
                </div>
            </div>
            <a href="indexNews.html">News</a>
            <a href="index.html#contact">Contact</a>
            <a href="index.html#about">About</a>
        </nav>
    </header>

    <script>
        const hamburger = document.getElementById('hamburger');
        const mobileNav = document.getElementById('mobileNav');

        hamburger.addEventListener('click', () => {
            mobileNav.classList.toggle('show');
            hamburger.classList.toggle('active');
        });

        const dropdowns = mobileNav.querySelectorAll('.dropdown');
        dropdowns.forEach(drop => {
            const btn = drop.querySelector('.dropbtn');
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                drop.classList.toggle('active');
            });
        });

        document.addEventListener('click', (e) => {
            if (!mobileNav.contains(e.target) && !hamburger.contains(e.target)) {
                mobileNav.classList.remove('show');
                dropdowns.forEach(d => d.classList.remove('active'));
                hamburger.classList.remove('active');
            }
        });
    </script>

    <!-- NEWS SECTION -->
    <section class="section" id="news">
        <h2>Latest News</h2>
        <p>Stay up-to-date with our latest updates and announcements.</p>

        <div class="news-container">
            <div class="news-card">
                <img src="assets/images/BoneMask.webp" alt="BoneMask">
                <div class="news-content">
                    <h3>Bone Mask!</h3>
                    <p>Meet the protagonist of Bone Path, the key character in our next adventure.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="footer-top">
            <div class="footer-left">
                <img src="assets/images/logo.webp" alt="Goblin Party Logo" class="footer-logo">
            </div>

            <div class="footer-center">
                <div class="follow-text">FOLLOW US</div>
                <div class="footer-social">
                    <a href="https://www.youtube.com/@GoblinPartyOfficial" target="_blank"><i class="fab fa-youtube"></i></a>
                    <a href="https://www.instagram.com/goblinpartyofficial/" target="_blank"><i class="fab fa-instagram"></i></a>
                </div>
            </div>

            <div class="footer-right">
                <nav>
                    <div class="dropdown">
                        <a href="index.html#projects" class="dropbtn">Games</i></a>
                        <div class="dropdown-content">
                            <a href="index.html#bonepath">Bone Path</a>
                        </div>
                    </div>
                    <a href="indexNews.html">News</a>
                    <a href="index.html#contact">Contact</a>
                    <a href="index.html#about">About</a>
                </nav>
            </div>
        </div>

        <hr class="footer-divider">

        <div class="footer-bottom">
            <p>© 2025 Goblin Party. All rights reserved.</p>
        </div>

    </footer>

    <!-- --- SCRIPT DROPDOWNS --- -->
    <script>
        const hamburger = document.getElementById('hamburger');
        const mobileNav = document.getElementById('mobileNav');

        hamburger.addEventListener('click', () => {
            mobileNav.classList.toggle('show');
            hamburger.classList.toggle('active');
        });

        const dropdowns = mobileNav.querySelectorAll('.dropdown');
        dropdowns.forEach(drop => {
            const btn = drop.querySelector('.dropbtn');
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                drop.classList.toggle('active');
            });
        });

        document.addEventListener('click', (e) => {
            if (!mobileNav.contains(e.target) && !hamburger.contains(e.target)) {
                mobileNav.classList.remove('show');
                dropdowns.forEach(d => d.classList.remove('active'));
                hamburger.classList.remove('active');
            }
        });
    </script>
</body>
</html>
